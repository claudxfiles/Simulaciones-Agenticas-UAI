server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nombre del Service K8s del orchestrator: {{ .Chart.Name }} en el chart
    # -> "mad-agents-orchestrator" (ver k8s/orchestrator-chart/templates/service.yaml).
    # Con Ingress habilitado, /api/* se resuelve directo ahí sin pasar por acá.
    location /api/ {
        proxy_pass http://mad-agents-orchestrator:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
