server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # En K8s, /api/* lo resuelve el Ingress apuntando directo al orchestrator.
    # Este proxy sirve solo para `docker run` suelto del frontend sin Ingress.
    location /api/ {
        proxy_pass http://orchestrator:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
