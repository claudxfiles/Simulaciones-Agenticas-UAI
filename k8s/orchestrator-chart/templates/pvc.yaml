{{- if .Values.persistence.chroma.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Chart.Name }}-chroma-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.chroma.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.chroma.size }}
{{- end }}
---
{{- if .Values.persistence.data.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Chart.Name }}-trace-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.data.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
{{- end }}
