# Despliegue pyme: un VPS con Docker basta.
# Producción real: agregar Traefik/reverse proxy delante y DATABASE_URL a Postgres.
services:
  orchestrator:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - chroma_data:/srv/chroma_data
      - trace_data:/srv/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Postgres local para desarrollo. En producción usar Supabase/managed.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    volumes:
      - agent_pgdata:/var/lib/postgresql/data
    profiles: ["dev"]

volumes:
  agent_pgdata:
  chroma_data:
  trace_data:
