[project]
name = "mad-agents-orchestrator"
version = "0.1.0"
description = "Orquestador de agentes retail mad_market: FastAPI + LangGraph + arquitectura hexagonal"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.1",
    "prometheus-fastapi-instrumentator>=7.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # Agentes worker
    "mcp>=1.2",
    "yfinance>=0.2.40",
    "numpy>=1.26,<2",
    "pandas>=2.0,<3",
    # RAG
    "chromadb>=0.5",
    # Trazabilidad (paso 07 del roadmap)
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
